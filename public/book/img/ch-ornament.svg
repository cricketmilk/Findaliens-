<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 50">
  <!-- outer pillars -->
  <rect x="60" y="20" width="1.5" height="30" fill="#c49a3c" opacity="0.45"/>
  <rect x="238" y="20" width="1.5" height="30" fill="#c49a3c" opacity="0.45"/>
  <!-- pointed arch -->
  <path d="M60 25 Q150 0 240 25" fill="none" stroke="#c49a3c" stroke-width="1" opacity="0.5"/>
  <!-- inner arch -->
  <path d="M75 25 Q150 8 225 25" fill="none" stroke="#8a6820" stroke-width="0.6" opacity="0.35"/>
  <!-- tracery circle at apex -->
  <circle cx="150" cy="14" r="6" fill="none" stroke="#e0c878" stroke-width="0.6" opacity="0.5"/>
  <circle cx="150" cy="14" r="2" fill="#e0c878" opacity="0.4"/>
  <!-- base line -->
  <line x1="40" y1="48" x2="110" y2="48" stroke="#8a6820" stroke-width="0.6" opacity="0.35"/>
  <line x1="190" y1="48" x2="260" y2="48" stroke="#8a6820" stroke-width="0.6" opacity="0.35"/>
  <!-- center ornament -->
  <path d="M140 46 L150 36 L160 46 L150 42 Z" fill="none" stroke="#c49a3c" stroke-width="0.6" opacity="0.5"/>
  <circle cx="150" cy="48" r="1.5" fill="#c49a3c" opacity="0.4"/>
</svg>